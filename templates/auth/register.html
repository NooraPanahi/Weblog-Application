<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>

<h1>Register</h1>

{{if .Error }}
<p>{{ .Error }}</p>
{{ end }}
<form method="POST" action="/register">
    <div>
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >
    </div>

    <div>
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
    </div>

    <button type="submit">Register</button>
</form>

</body>
</html>
