<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>

<h1>Login</h1>

{{ if .Error }}
<p>{{ .Error }}</p>
{{ end }}

<form method="POST" action="/login">
    <div>
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >
    </div>

    <div>
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
    </div>

    <button type="submit">Login</button>
</form>

</body>
</html>
