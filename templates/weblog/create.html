<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Weblog</title>
</head>
<body>

<h1>Create Weblog</h1>

{{ if .Error }}

<p>{{ .Error }}</p>
{{ end }}

<form method="POST" action="/weblog/create" enctype="multipart/form-data">

    <div>
        <label for="title">Title</label>
        <br>
        <input
            type="text"
            id="title"
            name="title"
            required
        >
    </div>

    <br>

    <div>
        <label for="content">Content</label>
        <br>
        <textarea
            id="content"
            name="content"
            rows="10"
            cols="60"
            required
        ></textarea>
    </div>

    <br>

    <div>
        <label for="image">Image</label>
        <br>
        <input
            type="file"
            id="image"
            name="image"
            accept="image/*"
        >
    </div>

    <br>

    <div>
        <label for="privacy">Privacy</label>
        <br>
        <select id="privacy" name="privacy">
            <option value="public">Public</option>
            <option value="private">Private</option>
        </select>
    </div>

    <br>

    <button type="submit">Create Weblog</button>

</form>
<br>

<a href="/">Back to Home</a>

</body>
</html>
