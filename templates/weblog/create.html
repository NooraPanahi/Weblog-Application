<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Weblog</title>
</head>
<body>

<h1>Create Weblog</h1>

{{ if .Error }}

<p>{{ .Error }}</p>
{{ end }}

<form method="POST" action="/weblog/create">


<div>
    <label for="title">Title</label>
    <input
        type="text"
        id="title"
        name="title"
        maxlength="255"
        required
    >
</div>

<br>

<div>
    <label for="content">Content</label>
    <textarea
        id="content"
        name="content"
        rows="10"
        cols="50"
        required
    ></textarea>
</div>

<br>

<div>
    <label for="image">Image URL (optional)</label>
    <input
        type="url"
        id="image"
        name="image"
    >
</div>

<br>

<div>
    <label for="privacy">Privacy</label>

    <select id="privacy" name="privacy">
        <option value="public">Public</option>
        <option value="private">Private</option>
    </select>
</div>

<br>

<button type="submit">Create Weblog</button>

</form>

<br>

<a href="/">Back to Home</a>

</body>
</html>
