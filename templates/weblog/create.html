<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Weblog</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui']
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">

<div class="absolute inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-40 -right-40 h-96 w-96 rounded-full bg-violet-600/20 blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 h-96 w-96 rounded-full bg-blue-600/20 blur-3xl"></div>
</div>

<nav class="border-b border-white/10 bg-slate-950/70 backdrop-blur-xl">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-6 py-5">
        <a href="/" class="text-xl font-bold tracking-tight">
            Web<span class="text-violet-400">log</span>
        </a>

        <a href="/"
           class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-sm font-medium text-slate-300 transition hover:bg-white/10 hover:text-white">
            ← Back to Home
        </a>
    </div>
</nav>

<main class="mx-auto max-w-3xl px-6 py-12">

    <div class="mb-10">
        <p class="mb-3 text-sm font-semibold uppercase tracking-[0.25em] text-violet-400">
            New Story
        </p>

        <h1 class="text-4xl font-bold tracking-tight text-white md:text-5xl">
            Create a new weblog
        </h1>

        <p class="mt-4 text-lg text-slate-400">
            Share your thoughts, ideas and stories with the world.
        </p>
    </div>

    {{ if .Error }}
    <div class="mb-6 rounded-2xl border border-red-500/20 bg-red-500/10 p-4 text-sm text-red-300">
        {{ .Error }}
    </div>
    {{ end }}

    <form method="POST"
          action="/weblog/create"
          enctype="multipart/form-data"
          class="space-y-7 rounded-3xl border border-white/10 bg-white/[0.04] p-6 shadow-2xl shadow-black/20 backdrop-blur-xl md:p-8">

        <div>
            <label for="title"
                   class="mb-2 block text-sm font-semibold text-slate-200">
                Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                required
                placeholder="Give your weblog a great title..."
                class="w-full rounded-2xl border border-white/10 bg-slate-900/70 px-5 py-4 text-white placeholder-slate-500 outline-none transition focus:border-violet-500 focus:ring-4 focus:ring-violet-500/10"
            >
        </div>

        <div>
            <label for="content"
                   class="mb-2 block text-sm font-semibold text-slate-200">
                Content
            </label>

            <textarea
                id="content"
                name="content"
                rows="12"
                required
                placeholder="Write your story here..."
                class="w-full resize-y rounded-2xl border border-white/10 bg-slate-900/70 px-5 py-4 leading-7 text-white placeholder-slate-500 outline-none transition focus:border-violet-500 focus:ring-4 focus:ring-violet-500/10"
            ></textarea>
        </div>

        <div>
            <label for="image"
                   class="mb-2 block text-sm font-semibold text-slate-200">
                Cover Image
            </label>

            <div class="rounded-2xl border border-dashed border-white/15 bg-slate-900/40 p-6">
                <input
                    type="file"
                    id="image"
                    name="image"
                    accept="image/*"
                    class="block w-full cursor-pointer text-sm text-slate-400 file:mr-4 file:cursor-pointer file:rounded-xl file:border-0 file:bg-violet-600 file:px-4 file:py-2.5 file:font-semibold file:text-white file:transition hover:file:bg-violet-500"
                >

                <p class="mt-3 text-xs text-slate-500">
                    Upload an image to make your weblog more attractive.
                </p>
            </div>
        </div>

        <div>
            <label for="privacy"
                   class="mb-2 block text-sm font-semibold text-slate-200">
                Privacy
            </label>

            <select
                id="privacy"
                name="privacy"
                class="w-full appearance-none rounded-2xl border border-white/10 bg-slate-900/70 px-5 py-4 text-white outline-none transition focus:border-violet-500 focus:ring-4 focus:ring-violet-500/10"
            >
                <option value="public">🌎 Public</option>
                <option value="private">🔒 Private</option>
            </select>

            <p class="mt-2 text-xs text-slate-500">
                Public weblogs can be discovered by other users. Private weblogs are restricted.
            </p>
        </div>

        <div class="flex flex-col gap-3 border-t border-white/10 pt-6 sm:flex-row">
            <button
                type="submit"
                class="flex-1 rounded-2xl bg-violet-600 px-6 py-4 font-semibold text-white shadow-lg shadow-violet-600/20 transition hover:-translate-y-0.5 hover:bg-violet-500 hover:shadow-violet-500/30"
            >
                Publish Weblog →
            </button>

            <a
                href="/"
                class="rounded-2xl border border-white/10 bg-white/5 px-6 py-4 text-center font-semibold text-slate-300 transition hover:bg-white/10 hover:text-white"
            >
                Cancel
            </a>
        </div>

    </form>

</main>

</body>
</html>
