<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            var savedTheme = localStorage.getItem("theme");
            if (savedTheme === "light") 
                document.documentElement.classList.remove("dark");
            else 
                document.documentElement.classList.add("dark");
        })();
    </script>
    <style>
        :root {
            --color-surface: 240 232 216;
            --color-char: 248 243 233;
            --color-cream: 37 32 25;
            --color-accent: 27 90 75;
            --color-pine-1: 81 58 37;
            --color-pine-2: 54 37 25;
            --color-pine-3: 33 22 15;
            --color-overlay: 37 32 25;
            --color-danger-300: 185 28 28;
            --color-danger-400: 185 28 28;
        }
        .dark {
            --color-surface: 21 18 15;
            --color-char: 29 25 21;
            --color-cream: 237 228 211;
            --color-accent: 114 199 175;
            --color-pine-1: 117 104 86;
            --color-pine-2: 85 73 58;
            --color-pine-3: 56 48 39;
            --color-overlay: 255 255 255;
            --color-danger-300: 252 165 165;
            --color-danger-400: 248 113 113;
        }
    </style>

<title>Create Weblog</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    parchment: "#F0E8D8",
                    paper: "#F8F3E9",

                    espresso: "#15120F",
                    surface: "rgb(var(--color-surface) / <alpha-value>)",
                    char: "rgb(var(--color-char) / <alpha-value>)",
                    ink: "#252019",
                    cream: "rgb(var(--color-cream) / <alpha-value>)",
                    lamp: {
                        DEFAULT: "#1B5A4B",
                        light: "#72C7AF"
                    },
                    accent: "rgb(var(--color-accent) / <alpha-value>)",
                    brass: "#B98A3C",
                    walnut: {
                        1: "#513A25",
                        2: "#362519",
                        3: "#21160F"
                    },
                    pine: {
                        1: "rgb(var(--color-pine-1) / <alpha-value>)",
                        2: "rgb(var(--color-pine-2) / <alpha-value>)",
                        3: "rgb(var(--color-pine-3) / <alpha-value>)"
                    },

                    white: "rgb(var(--color-overlay) / <alpha-value>)",
                    red: {
                        300: "rgb(var(--color-danger-300) / <alpha-value>)",
                        400: "rgb(var(--color-danger-400) / <alpha-value>)"
                    }
                },
                fontFamily: {
                    display: ["Fraunces", "serif"],
                    sans: ["Inter", "sans-serif"],
                    mono: ['"Space Mono"', "monospace"]
                }
            }
        }
    };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

</head>
<body class="min-h-screen bg-surface font-sans text-cream">
<div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
<div class="absolute -right-40 -top-40 h-96 w-96 rounded-full bg-lamp/[0.035] blur-3xl"></div>
<div class="absolute -bottom-40 -left-40 h-96 w-96 rounded-full bg-brass/[0.05] dark:bg-walnut-2/[0.07] blur-3xl"></div>
</div>

<!-- NAVBAR -->
<nav class="border-b border-white/[0.06] bg-surface/95 backdrop-blur-xl">
<div class="mx-auto flex max-w-4xl items-center justify-between px-6 py-5">

    <a href="/" class="font-display text-2xl font-semibold tracking-tight text-cream transition hover:text-accent"> 
    Web<span class="text-lamp">log</span>
    </a>

    <div class="flex items-center gap-3">

        <!-- Theme toggle -->
        <button id="themeToggle" type="button" aria-label="Toggle theme"
            class="rounded-lg border border-white/[0.08] bg-white/[0.025] p-2.5 text-sm text-pine-1 transition hover:bg-white/[0.05] hover:text-cream">
        🌙
    </button>

        <a href="/" class="rounded-lg border border-white/[0.08] bg-white/[0.025] px-4 py-2 text-sm font-medium text-pine-1 transition hover:border-lamp/20 hover:bg-white/[0.04] hover:text-cream" >
            ← Back to Home
        </a>
    </div>
</div>
</nav>

<main class="mx-auto max-w-3xl px-6 py-12">

<!-- HEADER -->
<div class="mb-10">
    <p class="mb-3 font-mono text-xs font-semibold uppercase tracking-[0.25em] text-lamp"> New Story </p>
    <h1 class="font-display text-5xl font-semibold tracking-tight text-cream"> Create a new weblog </h1>
    <p class="mt-4 text-lg leading-8 text-pine-1"> Share your thoughts, ideas and stories with the world. </p>
</div>

{{ if .Error }}

<div class="mb-6 rounded-xl border border-red-500/20 bg-red-500/[0.07] p-4 text-sm text-red-300"> {{ .Error }} </div>

{{ end }}

<!-- FORM -->
<form method="POST" action="/weblog/create" enctype="multipart/form-data"
    class="space-y-7 rounded-2xl border border-white/[0.07] bg-char p-6 shadow-2xl shadow-black/20 md:p-8">

    <!-- TITLE -->
    <div>
        <label for="title" class="mb-2 block text-sm font-semibold text-cream">
            Title
        </label>
        <input type="text" id="title" name="title"
            required
            placeholder="Give your weblog a great title..."
            class="w-full rounded-xl border border-white/[0.08] bg-surface px-5 py-4 text-cream placeholder-pine-2 outline-none transition focus:border-lamp/40 focus:ring-4 focus:ring-lamp/[0.08]">
    </div>

    <!-- CONTENT -->
    <div>
        <label for="content" class="mb-2 block text-sm font-semibold text-cream" > Content </label>
        <textarea id="content" name="content" rows="12" required
            placeholder="Write your story here..."
            class="w-full resize-y rounded-xl border border-white/[0.08] bg-surface px-5 py-4 leading-7 text-cream placeholder-pine-2 outline-none transition focus:border-lamp/40 focus:ring-4 focus:ring-lamp/[0.08]"
        ></textarea>

    </div>

    <!-- IMAGE -->
    <div>
        <label for="image" class="mb-2 block text-sm font-semibold text-cream">
            Cover Image
        </label>
        <div class="rounded-xl border border-dashed border-white/[0.10] bg-surface p-6">
            <input type="file" id="image" name="image" accept="image/*"
                class="block w-full cursor-pointer text-sm text-pine-1 file:mr-4 file:cursor-pointer file:rounded-lg file:border-0 file:bg-lamp file:px-4 file:py-2.5 file:font-semibold file:text-cream file:transition hover:file:bg-lamp-light hover:file:text-espresso">

            <p class="mt-3 text-xs text-pine-2">
                Upload an image to make your weblog more attractive.
            </p>
        </div>
    </div>

    <!-- PRIVACY -->
    <div>
        <label  for="privacy"  class="mb-2 block text-sm font-semibold text-cream"> Privacy </label>
        <select id="privacy" name="privacy"
            class="w-full appearance-none rounded-xl border border-white/[0.08] bg-surface px-5 py-4 text-cream outline-none transition focus:border-lamp/40 focus:ring-4 focus:ring-lamp/[0.08]" >

            <option value="public"> 🌎 Public </option>
            <option value="private"> 🔒 Private </option>

        </select>

        <p class="mt-2 text-xs text-pine-2"> Public weblogs can be discovered by other users. Private weblogs are restricted.</p>
    </div>

    <!-- ACTIONS -->
    <div class="flex flex-col gap-3 border-t border-white/[0.06] pt-6 sm:flex-row">
        <button  type="submit" class="flex-1 rounded-xl bg-lamp px-6 py-4 font-semibold text-cream transition hover:bg-lamp-light hover:text-espresso">
            Publish Weblog →
        </button>

        <a href="/" class="rounded-xl border border-white/[0.08] bg-white/[0.025] px-6 py-4 text-center font-semibold text-pine-1 transition hover:bg-white/[0.04] hover:text-cream">
            Cancel
        </a>
    </div>
</form>
</main>

<!-- THEME SCRIPT -->
<script src="/static/js/theme.js"></script>
</body>
</html>
