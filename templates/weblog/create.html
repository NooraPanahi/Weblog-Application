<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Weblog</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    parchment: "#F0E8D8",
                    paper: "#F8F3E9",

                    espresso: "#15120F",
                    char: "#1D1915",
                    ink: "#252019",
                    cream: "#EDE4D3",

                    lamp: {
                        DEFAULT: "#1B5A4B",
                        light: "#72C7AF"
                    },

                    brass: "#B98A3C",

                    walnut: {
                        1: "#513A25",
                        2: "#362519",
                        3: "#21160F"
                    },

                    pine: {
                        1: "#756856",
                        2: "#55493A",
                        3: "#383027"
                    }
                },

                fontFamily: {
                    display: ["Fraunces", "serif"],
                    sans: ["Inter", "sans-serif"],
                    mono: ['"Space Mono"', "monospace"]
                }
            }
        }
    };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

</head>
<body class="min-h-screen bg-espresso font-sans text-cream">
<div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
<div class="absolute -right-40 -top-40 h-96 w-96 rounded-full bg-lamp/[0.035] blur-3xl"></div>
<div class="absolute -bottom-40 -left-40 h-96 w-96 rounded-full bg-walnut-2/[0.07] blur-3xl"></div>
</div>

<!-- NAVBAR -->
<nav class="border-b border-white/[0.06] bg-espresso/95 backdrop-blur-xl">
<div class="mx-auto flex max-w-4xl items-center justify-between px-6 py-5">

    <a href="/" class="font-display text-2xl font-semibold tracking-tight text-cream transition hover:text-lamp-light"> 
    Web<span class="text-lamp">log</span>
    </a>

    <a href="/" class="rounded-lg border border-white/[0.08] bg-white/[0.025] px-4 py-2 text-sm font-medium text-pine-1 transition hover:border-lamp/20 hover:bg-white/[0.04] hover:text-cream" >
        ← Back to Home
    </a>

</div>
</nav>

<main class="mx-auto max-w-3xl px-6 py-12">

<!-- HEADER -->
<div class="mb-10">
    <p class="mb-3 font-mono text-xs font-semibold uppercase tracking-[0.25em] text-lamp"> New Story </p>
    <h1 class="font-display text-5xl font-semibold tracking-tight text-cream"> Create a new weblog </h1>
    <p class="mt-4 text-lg leading-8 text-pine-1"> Share your thoughts, ideas and stories with the world. </p>
</div>

{{ if .Error }}

<div class="mb-6 rounded-xl border border-red-500/20 bg-red-500/[0.07] p-4 text-sm text-red-300"> {{ .Error }} </div>

{{ end }}

<!-- FORM -->
<form method="POST" action="/weblog/create" enctype="multipart/form-data"
    class="space-y-7 rounded-2xl border border-white/[0.07] bg-char p-6 shadow-2xl shadow-black/20 md:p-8">

    <!-- TITLE -->
    <div>
        <label for="title" class="mb-2 block text-sm font-semibold text-cream">
            Title
        </label>
        <input type="text" id="title" name="title"
            required
            placeholder="Give your weblog a great title..."
            class="w-full rounded-xl border border-white/[0.08] bg-espresso px-5 py-4 text-cream placeholder-pine-2 outline-none transition focus:border-lamp/40 focus:ring-4 focus:ring-lamp/[0.08]">
    </div>

    <!-- CONTENT -->
    <div>
        <label for="content" class="mb-2 block text-sm font-semibold text-cream" > Content </label>
        <textarea id="content" name="content" rows="12" required
            placeholder="Write your story here..."
            class="w-full resize-y rounded-xl border border-white/[0.08] bg-espresso px-5 py-4 leading-7 text-cream placeholder-pine-2 outline-none transition focus:border-lamp/40 focus:ring-4 focus:ring-lamp/[0.08]"
        ></textarea>

    </div>

    <!-- IMAGE -->
    <div>
        <label for="image" class="mb-2 block text-sm font-semibold text-cream">
            Cover Image
        </label>
        <div class="rounded-xl border border-dashed border-white/[0.10] bg-espresso p-6">
            <input type="file" id="image" name="image" accept="image/*"
                class="block w-full cursor-pointer text-sm text-pine-1 file:mr-4 file:cursor-pointer file:rounded-lg file:border-0 file:bg-lamp file:px-4 file:py-2.5 file:font-semibold file:text-cream file:transition hover:file:bg-lamp-light hover:file:text-espresso">

            <p class="mt-3 text-xs text-pine-2">
                Upload an image to make your weblog more attractive.
            </p>
        </div>
    </div>

    <!-- PRIVACY -->
    <div>
        <label  for="privacy"  class="mb-2 block text-sm font-semibold text-cream"> Privacy </label>
        <select id="privacy" name="privacy"
            class="w-full appearance-none rounded-xl border border-white/[0.08] bg-espresso px-5 py-4 text-cream outline-none transition focus:border-lamp/40 focus:ring-4 focus:ring-lamp/[0.08]" >

            <option value="public"> 🌎 Public </option>
            <option value="private"> 🔒 Private </option>

        </select>

        <p class="mt-2 text-xs text-pine-2"> Public weblogs can be discovered by other users. Private weblogs are restricted.</p>
    </div>


    <!-- ACTIONS -->
    <div class="flex flex-col gap-3 border-t border-white/[0.06] pt-6 sm:flex-row">
        <button  type="submit" class="flex-1 rounded-xl bg-lamp px-6 py-4 font-semibold text-cream transition hover:bg-lamp-light hover:text-espresso">
            Publish Weblog →
        </button>

        <a href="/" class="rounded-xl border border-white/[0.08] bg-white/[0.025] px-6 py-4 text-center font-semibold text-pine-1 transition hover:bg-white/[0.04] hover:text-cream"
        >
            Cancel
        </a>
    </div>
</form>
</main>
</body>
</html>
